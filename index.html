<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>MAPEO DE REDES Y COLECTIVOS DE EXTREMADURA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="header">
    <div><img src="logo_congdex.jpeg" alt="CONGDEX" class="logo"></div>
    <div class="title-block">
      <div class="title">MAPEO DE REDES Y COLECTIVOS DE EXTREMADURA</div>
      <small>Con el apoyo de la Diputación Provincial de Cáceres</small>
    </div>
    <a class="web" href="https://congdextremadura.org/" target="_blank">https://congdextremadura.org/</a>
  </div>

  <div id="map"></div>

  <div class="search-container">
    <input type="text" id="searchBox" placeholder="Buscar entidad..." />
  </div>

  <div class="legend" id="legend">
    <button class="social active" data-cat="Social">Social</button>
    <button class="ambiental active" data-cat="Ambiental">Ambiental</button>
    <button class="economica active" data-cat="Económica">Económica</button>
    <button class="otra active" data-cat="Otra">Otra</button>
  </div>

  <script src="buscador.js"></script>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibW1pbGFjIiwiYSI6ImNpeWhkNXZsMDA1ZDgzMm4wdWRzdzRleWcifQ.crLVL3iFWYSbE5zrlkIA7w';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      center: [-6.34, 39.47],
      zoom: 7
    });

    map.addControl(new mapboxgl.NavigationControl());
    let allData = null;
    let openPopup = null;

    map.on('load', () => {
      const categorias = ['Social','Ambiental','Económica','Otra'];
      const iconos = {
        'Social': 'icono_social.png',
        'Ambiental': 'icono_ambiental.png',
        'Económica': 'icono_economica.png',
        'Otra': 'icono_otra.png'
      };

      let loadedIcons = 0;
      const loadIcons = () => {
        for (const [cat, img] of Object.entries(iconos)) {
          map.loadImage(img, (err, image) => {
            if (!err && image && !map.hasImage(cat)) {
              map.addImage(cat, image);
            }
            loadedIcons++;
            if (loadedIcons === categorias.length) loadData();
          });
        }
      };

      const loadData = () => {
        fetch('entidades.geojson', { cache: 'no-store' })
          .then(r => r.json())
          .then(data => {
            allData = data;
            categorias.forEach(cat => {
              map.addSource(cat, {
                type: 'geojson',
                data: {
                  type: 'FeatureCollection',
                  features: data.features.filter(f => f.properties.categoria === cat)
                }
              });
              map.addLayer({
                id: `layer-${cat}`,
                type: 'symbol',
                source: cat,
                layout: {
                  'icon-image': cat,
                  'icon-size': 0.8,
                  'icon-allow-overlap': true
                }
              });
            });

            categorias.forEach(cat => {
              map.on('click', `layer-${cat}`, e => {
                const p = e.features[0].properties;
                if (openPopup) openPopup.remove();
                map.flyTo({ center: e.lngLat, zoom: 11, speed: 0.8 });
                openPopup = new mapboxgl.Popup()
                  .setLngLat(e.lngLat)
                  .setHTML(`
                    <h3>${p.nombre_entidad}</h3>
                    <p><b>Temática:</b> ${p.tematica}</p>
                    <p><b>Ámbito:</b> ${p.ambito_geografico}</p>
                    <p><b>Localidad:</b> ${p.localidad}</p>
                    <p><b>Teléfono:</b> ${p.telefono}</p>
                    <p><b>Correo:</b> <a href="mailto:${p.correo}">${p.correo}</a></p>
                    <p><a href="${p.pagina_contacto}" target="_blank">Web</a></p>
                  `)
                  .addTo(map);
              });
            });

            document.querySelectorAll('.legend button').forEach(btn => {
              btn.addEventListener('click', () => {
                const cat = btn.getAttribute('data-cat');
                const active = btn.classList.toggle('active');
                btn.classList.toggle('inactive', !active);
                map.setLayoutProperty(`layer-${cat}`, 'visibility', active ? 'visible' : 'none');
              });
            });
          });
      };
      loadIcons();
    });
  </script>
</body>
</html>
