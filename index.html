<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAPEO DE REDES Y COLECTIVOS DE EXTREMADURA</title>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <style>
    :root{--verde:#2ecc71;--gris:#6b7280;--sombra:0 3px 8px rgba(0,0,0,.12);--alto-header:84px;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fff;}
    .topbar{position:fixed;inset:0 0 auto 0;z-index:1000;background:#fff;box-shadow:var(--sombra);}
    .topbar-inner{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;}
    .topbar img.logo{height:56px;object-fit:contain;}
    .titles{display:flex;flex-direction:column;gap:2px;}
    .titles .title{color:var(--verde);font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:clamp(16px,2.2vw,22px);}
    .titles .subtitle{color:var(--gris);font-size:14px;}
    .site-link{margin-left:auto;font-size:13px;color:#6b7280;text-decoration:none;text-transform:lowercase;}
    .site-link:hover{text-decoration:underline;}
    #map{position:fixed;top:var(--alto-header);left:0;right:0;bottom:0;width:100%;height:calc(100vh - var(--alto-header));}
    .searchbox{position:absolute;top:calc(var(--alto-header) + 10px);right:10px;width:min(380px,80vw);z-index:1002;}
    .searchbox input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:12px;box-shadow:var(--sombra);font-size:14px;}
    .suggestions{list-style:none;margin:6px 0 0 0;padding:0;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:var(--sombra);max-height:260px;overflow-y:auto;display:none;}
    .suggestions li{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;gap:8px;}
    .suggestions li:last-child{border-bottom:none;}
    .suggestions li:hover{background:#f9fafb;}
    .s-localidad{color:#6b7280;font-size:12px;white-space:nowrap;}
    .filters{position:absolute;left:10px;bottom:10px;z-index:1002;display:flex;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.95);padding:8px;border-radius:12px;box-shadow:var(--sombra);}
    .btn-cat{border:none;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;opacity:.9;display:flex;align-items:center;gap:8px}
    .btn-cat .dot{width:10px;height:10px;border-radius:50%}
    .btn-cat.active{box-shadow:0 0 0 2px rgba(0,0,0,.05) inset;opacity:1}
    .btn-social{background:#e8f1fb;color:#1d4ed8}.btn-social .dot{background:#3498db}
    .btn-ambiental{background:#e8f8f0;color:#047857}.btn-ambiental .dot{background:#2ecc71}
    .btn-economica{background:#fff8df;color:#a16207}.btn-economica .dot{background:#f1c40f}
    .btn-otra{background:#f3e8ff;color:#6b21a8}.btn-otra .dot{background:#9b59b6}
    .pulse{width:18px;height:18px;border-radius:50%;background:#111;box-shadow:0 0 0 rgba(17,17,17,0.4);animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(17,17,17,0.4)}70%{box-shadow:0 0 0 12px rgba(17,17,17,0)}100%{box-shadow:0 0 0 0 rgba(17,17,17,0)}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <img src="logo_congdex.jpeg" alt="CONGDEX" class="logo" onerror="this.style.display='none'"/>
      <div class="titles">
        <div class="title">MAPEO DE REDES Y COLECTIVOS DE EXTREMADURA</div>
        <div class="subtitle">Con el apoyo de la Diputación Provincial de Cáceres</div>
      </div>
      <a href="https://congdextremadura.org/" target="_blank" class="site-link">https://congdextremadura.org/</a>
    </div>
  </div>

  <div id="map"></div>

  <div class="searchbox">
    <input id="searchInput" type="text" placeholder="Buscar entidad..." autocomplete="off"/>
    <ul id="suggestions" class="suggestions"></ul>
  </div>

  <div class="filters">
    <button class="btn-cat btn-social active" data-layer="layer-Social"><span class="dot"></span>Social</button>
    <button class="btn-cat btn-ambiental active" data-layer="layer-Ambiental"><span class="dot"></span>Ambiental</button>
    <button class="btn-cat btn-economica active" data-layer="layer-Económica"><span class="dot"></span>Económica</button>
    <button class="btn-cat btn-otra active" data-layer="layer-Otra"><span class="dot"></span>Otra</button>
  </div>

  <script>
    mapboxgl.accessToken='pk.eyJ1IjoibW1pbGFjIiwiYSI6ImNpeWhkNXZsMDA1ZDgzMm4wdWRzdzRleWcifQ.crLVL3iFWYSbE5zrlkIA7w';
    const map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/light-v11',center:[-6.37,39.47],zoom:7.5});
    map.addControl(new mapboxgl.NavigationControl());
    const iconPaths={'Social':'icono_social.png','Ambiental':'icono_ambiental.png','Económica':'icono_economica.png','Otra':'icono_otra.png'};
    let activePopup=null; let allEntities=[]; let searchMarker=null;

    window.handleSearchSelection=(entity)=>{
      if(!entity||!entity.coord) return;
      map.flyTo({center:entity.coord,zoom:11});
      const p=entity.props;
      const html=`<strong>${p.nombre_entidad}</strong><br>
      <a href="${p.pagina_contacto}" target="_blank">Web</a><br>
      <b>Temática:</b> ${p.tematica}<br>
      <b>Ámbito:</b> ${p.ambito_geografico}<br>
      <b>Localidad:</b> ${p.localidad}<br>
      <b>Teléfono:</b> ${p.telefono}<br>
      <b>Correo:</b> ${p.correo}`;
      if(activePopup) activePopup.remove();
      activePopup=new mapboxgl.Popup().setLngLat(entity.coord).setHTML(html).addTo(map);
      if(searchMarker) searchMarker.remove();
      const el=document.createElement('div'); el.className='pulse';
      searchMarker=new mapboxgl.Marker(el).setLngLat(entity.coord).addTo(map);
      setTimeout(()=>{if(searchMarker) searchMarker.remove();}, 4000);
    };

    map.on('load',()=>{
      fetch('entidades.geojson').then(r=>r.json()).then(data=>{
        allEntities=data.features.map(f=>({
          name:f.properties.nombre_entidad||'',
          localidad:f.properties.localidad||'',
          coord:f.geometry.coordinates,
          props:f.properties
        }));

        const loads=Object.keys(iconPaths).map(cat=>new Promise(res=>{
          map.loadImage(iconPaths[cat],(err,img)=>{
            if(err){console.warn('Icono no cargado:',iconPaths[cat]); return res();}
            const id=cat+'-icon'; if(!map.hasImage(id)) map.addImage(id,img); res();
          });
        }));

        Promise.all(loads).then(()=>{
          const categorias=['Social','Ambiental','Económica','Otra'];
          categorias.forEach(cat=>{
            const feats=data.features.filter(f=>f.properties.categoria===cat);
            if(!feats.length) return;
            map.addSource(cat,{type:'geojson',data:{type:'FeatureCollection',features:feats}});
            map.addLayer({
              id:'layer-'+cat,type:'symbol',source:cat,
              layout:{'icon-image':cat+'-icon','icon-size':0.8,'icon-allow-overlap':true,'visibility':'visible'}
            });
            map.on('click','layer-'+cat',(e)=>{
              const p=e.features[0].properties; const c=e.features[0].geometry.coordinates;
              if(activePopup) activePopup.remove();
              map.flyTo({center:c,zoom:11});
              const html=`<strong>${p.nombre_entidad}</strong><br>
              <a href="${p.pagina_contacto}" target="_blank">Web</a><br>
              <b>Temática:</b> ${p.tematica}<br>
              <b>Ámbito:</b> ${p.ambito_geografico}<br>
              <b>Localidad:</b> ${p.localidad}<br>
              <b>Teléfono:</b> ${p.telefono}<br>
              <b>Correo:</b> ${p.correo}`;
              activePopup=new mapboxgl.Popup().setLngLat(c).setHTML(html).addTo(map);
            });
          });
          const bbox=turf.bbox(data); map.fitBounds(bbox,{padding:80,duration:1200});
        });

        document.querySelectorAll('.btn-cat').forEach(btn=>{
          btn.addEventListener('click',()=>{
            const layer=btn.dataset.layer;
            const visible = map.getLayoutProperty(layer,'visibility')!=='none';
            map.setLayoutProperty(layer,'visibility', visible ? 'none':'visible');
            btn.classList.toggle('active', !visible===true);
          });
        });

        if(window.initBuscador) window.initBuscador(allEntities);
      });
    });
  </script>

  <script src="buscador.js"></script>
</body>
</html>
