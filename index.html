<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa de Redes y Colectivos de Extremadura</title>
  <link href="https://cdn.jsdelivr.net/npm/mapbox-gl@2.16.1/dist/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="logos">
        <img src="caceres.png" alt="Diputación de Cáceres" class="logo" />
        <img src="logo_congdex.jpeg" alt="CONGDEX" class="logo" />
      </div>
      <div class="header-text">
        <h1 class="titulo">Mapa de Redes y Colectivos de Extremadura</h1>
        <p class="subtitulo">Con el apoyo de la Diputación Provincial de Cáceres</p>
      </div>
      <div class="header-right">
        <a href="https://congdextremadura.org" target="_blank" class="web-link">congdextremadura.org</a>
        <div class="search-box-header">
          <input id="busqueda" type="text" placeholder="Buscar entidad" autocomplete="off" />
          <ul id="suggestions" class="suggestions"></ul>
        </div>
      </div>
    </div>
  </header>

  <main class="map-wrap">
    <div id="map"></div>
    <div id="filters" class="category-buttons"></div>
    <div id="loading" class="loading">Cargando mapa...</div>
    <button class="informe-btn" onclick="window.open('URL_DEL_INFORME','_blank')">
      Accede al informe Mapeo de redes y colectivos de Extremadura elaborado por El Ojo Sostenible
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/mapbox-gl@2.16.1/dist/mapbox-gl.js"></script>
  <script src="buscador.js" defer></script>
</body>
</html>
