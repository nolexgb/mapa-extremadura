<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Interactivo de Extremadura | CONGDEX</title>

  <!-- Mapbox GL JS (v2 estable) -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabecera -->
  <header class="header">
    <div class="header-content">
      <img class="logo" src="logo_congdex.jpeg" alt="CONGDEX">
      <div class="header-text">
        <h1>Redes y Colectivos de Extremadura</h1>
        <p>Mapa interactivo de entidades de la región. Busca por nombre, localidad o temática y filtra por categoría.</p>
      </div>
      <a class="web-link" href="https://coordinadoraextremadura.org" target="_blank" rel="noopener">coordinadoraextremadura.org</a>
    </div>
  </header>

  <!-- Controles: buscador + filtros -->
  <div class="search-box">
    <input id="busqueda" type="text" placeholder="Buscar (nombre, localidad o temática)..." aria-label="Buscar entidades">
  </div>
  <div id="filters" class="category-buttons" aria-label="Filtros de categoría"></div>

  <!-- Mapa -->
  <div id="map" role="application" aria-label="Mapa interactivo de entidades"></div>

  <!-- Script del mapa -->
  <script src="buscador.js"></script>
</body>
</html>
