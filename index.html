<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mapeo de Redes y Colectivos de Extremadura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- CABECERA -->
  <header class="header">
    <img src="logo_congdex.jpeg" class="logo" alt="CONGDEX">
    <div class="title-block">
      <div class="title">MAPEO DE REDES Y COLECTIVOS DE EXTREMADURA</div>
      <small>Con el apoyo de la Diputación Provincial de Cáceres</small>
    </div>
    <a class="web" href="https://congdextremadura.org/" target="_blank">https://congdextremadura.org/</a>
  </header>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- BUSCADOR -->
  <div class="search-container">
    <input type="text" id="searchBox" placeholder="Buscar entidad..." autocomplete="off" />
  </div>

  <!-- BOTONES DE CATEGORÍAS -->
  <div class="legend-buttons">
    <button data-cat="Social" class="active">Social</button>
    <button data-cat="Ambiental" class="active">Ambiental</button>
    <button data-cat="Económica" class="active">Económica</button>
    <button data-cat="Otra" class="active">Otra</button>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibW1pbGFjIiwiYSI6ImNpeWhkNXZsMDA1ZDgzMm4wdWRzdzRleWcifQ.crLVL3iFWYSbE5zrlkIA7w';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      center: [-6.338, 39.472],
      zoom: 7
    });

    map.addControl(new mapboxgl.NavigationControl());

    let allData = null;
    let openPopup = null;

    map.on('load', () => {
      fetch('entidades.geojson')
        .then(res => res.json())
        .then(data => {
          allData = data;
          const categorias = ['Social', 'Ambiental', 'Económica', 'Otra'];
          const iconos = {
            'Social': 'icono_social.png',
            'Ambiental': 'icono_ambiental.png',
            'Económica': 'icono_economica.png',
            'Otra': 'icono_otra.png'
          };

          // Crear capas
          categorias.forEach(cat => {
            map.loadImage(iconos[cat], (error, image) => {
              if (error) return;
              if (!map.hasImage(cat)) map.addImage(cat, image);

              const subset = {
                type: "FeatureCollection",
                features: data.features.filter(f => f.properties.categoria === cat)
              };
              map.addSource(cat, { type: "geojson", data: subset });

              map.addLayer({
                id: `layer-${cat}`,
                type: "symbol",
                source: cat,
                layout: { "icon-image": cat, "icon-size": 0.08, "icon-allow-overlap": true }
              });

              // Popup
              map.on('click', `layer-${cat}`, e => {
                const p = e.features[0].properties;
                const html = `
                  <div style="display:flex;align-items:center;gap:8px;">
                    <img src="${iconos[p.categoria]}" width="28" height="28">
                    <h3 style="margin:0;">${p.nombre_entidad}</h3>
                  </div>
                  <p><b>Temática:</b> ${p.tematica}</p>
                  <p><b>Ámbito:</b> ${p.ambito_geografico}</p>
                  <p><b>Localidad:</b> ${p.localidad}</p>
                  <p><b>Teléfono:</b> ${p.telefono}</p>
                  <p><b>Correo:</b> <a href="mailto:${p.correo}">${p.correo}</a></p>
                  <p><a href="${p.pagina_contacto}" target="_blank">Web</a></p>`;

                if (openPopup) openPopup.remove();
                openPopup = new mapboxgl.Popup()
                  .setLngLat(e.lngLat)
                  .setHTML(html)
                  .addTo(map);
              });
            });
          });

          // Mostrar todos los puntos al inicio
          map.fitBounds([
            [-7.5, 38.3], // suroeste
            [-5.2, 40.2]  // noreste
          ]);
        });
    });
  </script>

  <!-- SCRIPT DE BUSCADOR -->
  <script src="buscador.js"></script>
</body>
</html>
