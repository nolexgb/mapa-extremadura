<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapeo de Redes y Colectivos de Extremadura</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
    rel="stylesheet"
  />
</head>
<body>
  <header class="header">
    <img src="logo_congdex.jpeg" alt="Logo CONGDEX" class="logo" />
    <h1>MAPEO DE REDES Y COLECTIVOS DE EXTREMADURA</h1>
    <p>Con el apoyo de la Diputación Provincial de Cáceres</p>
    <a
      href="https://congdextremadura.org/"
      class="web"
      target="_blank"
      >https://congdextremadura.org/</a
    >
  </header>

  <div id="map"></div>

  <div class="search-container">
    <input type="text" id="searchBox" placeholder="Buscar entidad..." />
  </div>

  <div class="category-buttons">
    <button id="btnSocial" class="btn-social">Social</button>
    <button id="btnAmbiental" class="btn-ambiental">Ambiental</button>
    <button id="btnEconomica" class="btn-economica">Económica</button>
    <button id="btnOtra" class="btn-otra">Otra</button>
  </div>

  <script>
    mapboxgl.accessToken =
      "pk.eyJ1Ijoibm9sZXhnYiIsImEiOiJjbTJocGhhd2owN2Z1MnBvM3h0Nml5bm1tIn0.3c5TPlZzqKQUZ8EJk2c-tg";

    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/light-v11",
      center: [-6.35, 39.3],
      zoom: 7.2,
      minZoom: 6,
      maxZoom: 15,
    });

    const iconos = {
      Social: "icono_social.png",
      Ambiental: "icono_ambiental.png",
      Economica: "icono_economica.png",
      Otra: "icono_otra.png",
    };

    let markers = [];

    map.on("load", () => {
      map.setPaintProperty("background", "background-color", "#f9f9f9");

      fetch("entidades.geojson")
        .then((res) => res.json())
        .then((data) => {
          window.allData = data;
          const bounds = new mapboxgl.LngLatBounds();

          data.features.forEach((f) => {
            const cat = f.properties.categoria;
            const el = document.createElement("div");
            el.className = "marker";
            el.style.backgroundImage = `url(${iconos[cat]})`;
            el.style.width = "32px";
            el.style.height = "32px";
            el.style.backgroundSize = "cover";

            const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(`
              <div style="display:flex;align-items:center;gap:8px;">
                <img src="${iconos[cat]}" width="24" height="24" alt="${cat}">
                <h3 style="margin:0;">${f.properties.nombre_entidad}</h3>
              </div>
              <p><b>Temática:</b> ${f.properties.tematica}</p>
              <p><b>Ámbito:</b> ${f.properties.ambito_geografico}</p>
              <p><b>Localidad:</b> ${f.properties.localidad}</p>
              <p><b>Teléfono:</b> ${f.properties.telefono}</p>
              <p><b>Correo:</b> <a href="mailto:${f.properties.correo}">${f.properties.correo}</a></p>
              <p><a href="${f.properties.pagina_contacto}" target="_blank">Sitio web</a></p>
            `);

            const marker = new mapboxgl.Marker(el)
              .setLngLat(f.geometry.coordinates)
              .setPopup(popup)
              .addTo(map);

            marker.categoria = cat;
            markers.push(marker);
            bounds.extend(f.geometry.coordinates);
          });

          map.fitBounds(bounds, { padding: 60 });
        });
    });

    function toggleLayer(cat) {
      markers.forEach((m) => {
        if (m.categoria === cat) {
          const visible = m._element.style.display !== "none";
          m._element.style.display = visible ? "none" : "block";
        }
      });
    }

    document
      .getElementById("btnSocial")
      .addEventListener("click", () => toggleLayer("Social"));
    document
      .getElementById("btnAmbiental")
      .addEventListener("click", () => toggleLayer("Ambiental"));
    document
      .getElementById("btnEconomica")
      .addEventListener("click", () => toggleLayer("Economica"));
    document
      .getElementById("btnOtra")
      .addEventListener("click", () => toggleLayer("Otra"));
  </script>

  <script src="buscador.js"></script>
</body>
</html>
