<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa de Redes y Colectivos de Extremadura</title>

  <!-- Mapbox CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.16.1/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="header">
    <div class="header-content">
      <div class="logos">
        <img src="caceres.png" alt="Diputación de Cáceres" class="logo" />
        <img src="logo_congdex.jpeg" alt="CONGDEX" class="logo" />
      </div>
      <div class="header-text">
        <h1 class="titulo">Mapa de Redes y Colectivos de Extremadura</h1>
        <p class="subtitulo">Con el apoyo de la Diputación Provincial de Cáceres</p>
      </div>
      <div class="header-right">
        <a href="https://congdextremadura.org" target="_blank" class="web-link">congdextremadura.org</a>
        <div class="search-box-header">
          <input id="busqueda" type="text" placeholder="Buscar entidad" autocomplete="off" />
          <ul id="suggestions" class="suggestions"></ul>
        </div>
      </div>
    </div>
  </header>

  <main class="map-wrap">
    <div id="map"></div>
    <div id="filters" class="category-buttons"></div>

    <button class="informe-btn"
      onclick="window.open('https://congdextremadura.org/wp-content/uploads/2025/11/MapeoCONGDEX_07.11.25.pdf','_blank')">
      Accede al informe Mapeo de redes y colectivos de Extremadura elaborado por El Ojo Sostenible
    </button>
  </main>

  <!-- Mapbox JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.16.1/mapbox-gl.js"></script>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibW1pbGFjIiwiYSI6ImNpeWhkNXZsMDA1ZDgzMm4wdWRzdzRleWcifQ.crLVL3iFWYSbE5zrlkIA7w';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      center: [-6.38, 39.39],
      zoom: 7
    });

    const categorias = {
      SOCIALES: '#FFD700',
      AMBIENTALES: '#009b4d',
      ECONÓMICAS: '#FF7F00'
    };

    const loading = document.createElement('div');
    loading.innerText = 'Cargando mapa...';
    loading.style.position = 'absolute';
    loading.style.top = '50%';
    loading.style.left = '50%';
    loading.style.transform = 'translate(-50%, -50%)';
    loading.style.color = '#009b4d';
    loading.style.fontWeight = 'bold';
    document.body.appendChild(loading);

    map.on('load', () => {
      fetch('entidades.geojson')
        .then(response => response.json())
        .then(data => {
          document.body.removeChild(loading);

          const features = data.features;
          const categoryCounts = { SOCIALES: 0, AMBIENTALES: 0, ECONÓMICAS: 0 };

          features.forEach(f => {
            const cat = f.properties.categoria?.trim().toUpperCase();
            if (categoryCounts[cat] !== undefined) categoryCounts[cat]++;
          });

          const filtersDiv = document.getElementById('filters');
          for (const cat in categorias) {
            const label = document.createElement('label');
            label.dataset.cat = cat;
            label.innerHTML = `<input type="checkbox" checked data-cat="${cat}" /> ${cat} (${categoryCounts[cat]})`;
            filtersDiv.appendChild(label);
          }

          const markers = [];

          features.forEach(feature => {
            const props = feature.properties;
            const categoria = props.categoria?.trim().toUpperCase();
            const color = categorias[categoria] || '#999';

            const marker = new mapboxgl.Marker({ color })
              .setLngLat(feature.geometry.coordinates)
              .addTo(map);

            const popupHTML = `
              <div>
                <h3>${props.nombre_entidad}</h3>
                <p><strong>Categoría:</strong> ${props.categoria}</p>
                <p><strong>Dirección:</strong> ${props.direccion}</p>
                <p><strong>Localidad:</strong> ${props.localidad}</p>
                <p><strong>Sitio web:</strong> <a href="${props.pagina_contacto}" target="_blank">Sitio web</a></p>
                <p><strong>Temáticas:</strong> ${props.tematica}</p>
              </div>
            `;

            const popup = new mapboxgl.Popup({ offset: 25, maxWidth: '320px' }).setHTML(popupHTML);
            marker.getElement().addEventListener('click', () => popup.addTo(map));

            markers.push({ marker, categoria, nombre: props.nombre_entidad.toLowerCase() });
          });

          document.querySelectorAll('#filters input[type=checkbox]').forEach(input => {
            input.addEventListener('change', () => {
              const cat = input.dataset.cat;
              markers.forEach(({ marker, categoria }) => {
                if (categoria === cat) {
                  input.checked ? marker.addTo(map) : marker.remove();
                }
              });
            });
          });
        })
        .catch(err => {
          console.error("Error al cargar entidades.geojson:", err);
          alert("No se pudo cargar el mapa. Revisa el archivo entidades.geojson o su ruta.");
        });
    });
  </script>
</body>
</html>
