<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa - Redes y Colectivos de Extremadura</title>

  <!-- MAPBOX -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">

  <!-- ESTILOS -->
  <link rel="stylesheet" href="style.css">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Estilo del buscador */
    .search-box {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: white;
      border-radius: 10px;
      padding: 6px 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .search-box input {
      border: none;
      outline: none;
      width: 200px;
    }

    /* Botones de categorías */
    .category-buttons {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .category-buttons button {
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .category-buttons button:hover {
      transform: scale(1.05);
    }

    .social { background: #1E90FF; }
    .ambiental { background: #3CB371; }
    .economica { background: #FFD700; color: black; }
    .otra { background: #BA55D3; }

    @media (max-width: 768px) {
      .search-box input {
        width: 140px;
      }

      .category-buttons {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- Buscador -->
  <div class="search-box">
    <input type="text" id="buscador" placeholder="Buscar entidad...">
  </div>

  <!-- Botones de categorías -->
  <div class="category-buttons">
    <button class="social" onclick="filtrarCategoria('Social')">Social</button>
    <button class="ambiental" onclick="filtrarCategoria('Ambiental')">Ambiental</button>
    <button class="economica" onclick="filtrarCategoria('Económica')">Económica</button>
    <button class="otra" onclick="filtrarCategoria('Otra')">Otra</button>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoibm9sZXhnYiIsImEiOiJjbTc5MmM2c2kwMnZyMmxwYnVxN2RscnZtIn0.G_1QeoBGOnj_zxgsK9rKkQ';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      center: [-6.4, 39.3],
      zoom: 7
    });

    // Contenedor de marcadores
    let marcadores = [];

    // Cargar datos del GeoJSON
    fetch('entidades.geojson')
      .then(response => response.json())
      .then(data => {
        mostrarEntidades(data.features);

        // Mostrar todos los puntos al inicio
        map.on('load', () => {
          map.resize();
        });

        // Hacer que el mapa se ajuste automáticamente a los puntos
        const bounds = new mapboxgl.LngLatBounds();
        data.features.forEach(f => bounds.extend(f.geometry.coordinates));
        map.fitBounds(bounds, { padding: 60, maxZoom: 8 });
      })
      .catch(err => console.error('Error al cargar entidades.geojson:', err));

    // Mostrar entidades
    function mostrarEntidades(entidades) {
      limpiarMarcadores();

      entidades.forEach(ent => {
        const cat = ent.properties.categoria.toLowerCase();
        const iconos = {
          social: 'icon_social.png',
          ambiental: 'icon_ambiental.png',
          económica: 'icon_economica.png',
          otra: 'icon_otra.png'
        };

        const el = document.createElement('img');
        el.src = iconos[cat] || 'icon_otra.png';
        el.style.width = '28px';
        el.style.height = '28px';
        el.style.borderRadius = '50%';
        el.style.cursor = 'pointer';

        const marker = new mapboxgl.Marker(el)
          .setLngLat(ent.geometry.coordinates)
          .setPopup(
            new mapboxgl.Popup({ offset: 20 }).setHTML(`
              <strong>${ent.properties.nombre_entidad}</strong><br>
              <em>${ent.properties.tematica}</em><br>
              📍 ${ent.properties.localidad}<br>
              ☎️ ${ent.properties.telefono}<br>
              ✉️ ${ent.properties.correo}<br>
              🌐 <a href="${ent.properties.pagina_contacto}" target="_blank">Ver sitio web</a>
            `)
          )
          .addTo(map);

        marcadores.push(marker);
      });
    }

    // Limpia los marcadores antes de volver a mostrarlos
    function limpiarMarcadores() {
      marcadores.forEach(m => m.remove());
      marcadores = [];
    }

    // Filtrado por categoría
    function filtrarCategoria(categoria) {
      fetch('entidades.geojson')
        .then(response => response.json())
        .then(data => {
          const filtradas = data.features.filter(
            e => e.properties.categoria.toLowerCase() === categoria.toLowerCase()
          );
          mostrarEntidades(filtradas);
        });
    }

    // Buscador predictivo
    document.getElementById('buscador').addEventListener('input', e => {
      const valor = e.target.value.toLowerCase();
      fetch('entidades.geojson')
        .then(response => response.json())
        .then(data => {
          const filtradas = data.features.filter(
            e => e.properties.nombre_entidad.toLowerCase().includes(valor)
          );
          mostrarEntidades(filtradas);
        });
    });
  </script>
</body>
</html>
